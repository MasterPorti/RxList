services:
  web:
    build: .
    environment:
      WHISPER_URL: http://whisper:8000
      RESET_DEMO_ON_START: ${RESET_DEMO_ON_START:-true}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    depends_on:
      whisper: { condition: service_healthy }
    restart: unless-stopped
  whisper:
    build: ./whisper
    environment: { WHISPER_MODEL: ${WHISPER_MODEL:-base} }
    volumes: [whisper-cache:/root/.cache]
    healthcheck: { test: [CMD, wget, -qO-, http://localhost:8000/health], interval: 30s, timeout: 10s, retries: 3 }
volumes:
  whisper-cache:
